[package]
name = "easyclip-desktop"
version = "0.1.0"
description = "Local-first AI video clipping studio for Windows"
authors = ["EasyClip"]
edition = "2021"

[lib]
name = "easyclip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
