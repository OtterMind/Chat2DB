services:
  mysql-tls:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: chat2db_fixture_root
      MYSQL_DATABASE: chat2db_tls_fixture
    ports:
      - "127.0.0.1:33306:3306"
    volumes:
      - ./certs:/certs:ro
      - ./tls.cnf:/etc/mysql/conf.d/tls.cnf:ro
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pchat2db_fixture_root"]
      interval: 2s
      timeout: 2s
      retries: 30
