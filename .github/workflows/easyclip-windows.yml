name: Build EasyClip Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "easyclip-desktop/**"
      - ".github/workflows/easyclip-windows.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows 11 x64 NSIS installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: easyclip-desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: easyclip-desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Bundle FFmpeg and FFprobe
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/GyanD/codexffmpeg/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "essentials_build\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "FFmpeg essentials ZIP was not found" }
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          New-Item -ItemType Directory -Force src-tauri/resources/bin | Out-Null
          $bin = Get-ChildItem ffmpeg-unpacked -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)/bin/ffmpeg.exe" src-tauri/resources/bin/ffmpeg.exe
          Copy-Item "$($bin.FullName)/bin/ffprobe.exe" src-tauri/resources/bin/ffprobe.exe

      - name: Build and bundle EasyClip
        run: npm run tauri build

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: EasyClip-Desktop-Windows-x64-unsigned
          path: easyclip-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
