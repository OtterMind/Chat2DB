name: 🎬 Build Cutting Edge Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cutting-edge-build

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z" -OutFile "ffmpeg.7z"
          & 7z x ffmpeg.7z -offmpeg_build | Out-Null
          New-Item -ItemType Directory -Force -Path ..\build\ffmpeg | Out-Null
          Copy-Item "ffmpeg_build\*\bin\ffmpeg.exe" "..\build\ffmpeg\"
          Copy-Item "ffmpeg_build\*\bin\ffprobe.exe" "..\build\ffmpeg\"

      - name: Setup backend
        shell: pwsh
        run: |
          python -m venv ..\build\backend\python
          ..\build\backend\python\Scripts\pip install -r backend\requirements.txt -q
          Copy-Item -Recurse -Force backend\app ..\build\backend\app
          Copy-Item -Recurse -Force backend\core ..\build\backend\core
          Copy-Item backend\run_backend.py ..\build\backend\

      - name: Build frontend
        shell: pwsh
        working-directory: cutting-edge-build/frontend
        run: |
          npm install --no-audit --no-fund
          npx vite build

      - name: Package installer
        shell: pwsh
        working-directory: cutting-edge-build/frontend
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Cutting-Edge-Windows-Setup
          path: cutting-edge-build/frontend/release/*.exe
