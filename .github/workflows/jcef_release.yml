name: Build Community Desktop Release
run-name: Community Desktop ${{ github.event_name == 'push' && 'release' || 'gray' }} ${{ inputs.version || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Gray build version, without the v prefix'
        required: true
        type: string

env:
  COMMUNITY_GITHUB_REPOSITORY: OtterMind/Chat2DB
  # Maintainer-approved one-time bridge release. Only this release publishes the
  # legacy CDN compatibility manifest and payloads for CDN-only installed clients;
  # N+1 and later releases must never publish to the CDN.
  COMMUNITY_BRIDGE_VERSION: "5.4.0"
  ALLOWED_EXTRA_RELEASE_ASSETS: ""

concurrency:
  group: community-desktop-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      channel: ${{ steps.metadata.outputs.channel }}
      update_latest: ${{ steps.metadata.outputs.update_latest }}
      publish: ${{ steps.metadata.outputs.publish }}
      package_prefix: ${{ steps.metadata.outputs.package_prefix }}
      update_prefix: ${{ steps.metadata.outputs.update_prefix }}
      is_bridge_n: ${{ steps.metadata.outputs.is_bridge_n }}
    steps:
      - name: Validate version
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          BRIDGE_VERSION: ${{ env.COMMUNITY_BRIDGE_VERSION }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "push" ]; then
            if [[ "${REF_NAME}" != v* ]]; then
              echo "Tag must start with v: ${REF_NAME}" >&2
              exit 1
            fi
            version="${REF_NAME#v}"
            channel=release
            update_latest=true
            publish=true
          else
            version="${INPUT_VERSION}"
            channel=gray
            update_latest=false
            publish=false
          fi

          if [[ ! "${version}" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})$ ]]; then
            echo "Version must use numeric SemVer without a v prefix, for example 5.3.0: ${version}" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if [ "${major}" -lt 4 ]; then
            echo "Public Community releases start at major version 4: ${version}" >&2
            exit 1
          fi
          if [ "${major}" -gt 255 ] || [ "${minor}" -gt 255 ] || [ "${patch}" -gt 65535 ]; then
            echo "Version exceeds the Windows MSI version limits: ${version}" >&2
            exit 1
          fi

          package_prefix="community/${version}"
          update_prefix="community/updates/${version}"

          is_bridge_n="false"
          if [ "${channel}" = "release" ] && [ "${version}" = "${BRIDGE_VERSION}" ]; then
            is_bridge_n="true"
          fi

          {
            echo "version=${version}"
            echo "tag_name=v${version}"
            echo "channel=${channel}"
            echo "update_latest=${update_latest}"
            echo "publish=${publish}"
            echo "package_prefix=${package_prefix}"
            echo "update_prefix=${update_prefix}"
            echo "is_bridge_n=${is_bridge_n}"
          } >> "${GITHUB_OUTPUT}"

  notify_start:
    name: Notify Feishu Community gray build start
    needs: resolve
    if: ${{ needs.resolve.outputs.channel == 'gray' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Feishu start notification
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_NOTIFY_WEBHOOK }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          webhook = os.environ.get("FEISHU_WEBHOOK_URL", "")
          if not webhook:
              print("FEISHU_RELEASE_NOTIFY_WEBHOOK is not configured; skip start notification.")
              raise SystemExit(0)

          lines = [
              "Chat2DB Community gray build started",
              f"Version: {os.environ['VERSION']}",
              "Distribution: GitHub Actions artifacts only",
              f"Workflow run: {os.environ['RUN_URL']}",
          ]
          payload = json.dumps(
              {"msg_type": "text", "content": {"text": "\n".join(lines)}},
              ensure_ascii=False,
          ).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if result.get("code", 0) != 0:
                  print(f"::warning::Feishu start notification was rejected: {result}")
          except urllib.error.URLError as exc:
              print(f"::warning::Feishu start notification failed: {exc}")

  build_update_payloads:
    name: Build canonical updater payload
    needs: resolve
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          cache: yarn
          cache-dependency-path: chat2db-community-client/yarn.lock

      - name: Install Ubuntu packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm desktop-file-utils file curl zip jq

      - name: Build canonical updater payload
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMUNITY_GITHUB_REPOSITORY: ${{ env.COMMUNITY_GITHUB_REPOSITORY }}
        run: |
          set -euo pipefail
          script/package/build_canonical_payload.sh "${VERSION}"

      - name: Upload canonical updater payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat2db-community-canonical-payload-${{ needs.resolve.outputs.version }}
          if-no-files-found: error
          overwrite: true
          path: jpackage/canonical-artifact/${{ needs.resolve.outputs.version }}

  build_native_packages:
    name: Build ${{ matrix.artifact_name }} installer
    needs:
      - resolve
      - build_update_payloads
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            artifact_name: macos-arm64
          - os: macos-15-intel
            target: mac
            artifact_name: macos-x64
          - os: windows-latest
            target: win
            artifact_name: windows
          - os: ubuntu-22.04
            target: linux
            artifact_name: linux-x64
          - os: ubuntu-22.04-arm
            target: linux
            artifact_name: linux-arm64

    runs-on: ${{ matrix.os }}
    permissions:
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          cache: yarn
          cache-dependency-path: chat2db-community-client/yarn.lock

      - name: Install Ubuntu packaging dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm desktop-file-utils file curl zip

      - name: Test macOS native signing selection
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: bash script/package/tests/sign-macos-native-libraries-test.sh

      - name: Import macOS code-signing certificate
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.MAC_CERTS }}" | base64 --decode > certificate.p12
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain"
          security create-keychain -p "${{ secrets.MAC_CERTS_PASSWORD }}" "${KEYCHAIN_PATH}"
          security default-keychain -s "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${{ secrets.MAC_CERTS_PASSWORD }}" "${KEYCHAIN_PATH}"
          security import certificate.p12 -k "${KEYCHAIN_PATH}" -P "${{ secrets.MAC_CERTS_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.MAC_CERTS_PASSWORD }}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning

      - name: Resolve macOS signing identity
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          SIGN_ID="${MAC_SIGNING_IDENTITY:-}"
          if [ -n "${SIGN_ID}" ] && ! security find-identity -v -p codesigning | grep -F "${SIGN_ID}" >/dev/null; then
            echo "Configured macOS signing identity not found: ${SIGN_ID}" >&2
            SIGN_ID=""
          fi
          if [ -z "${SIGN_ID}" ]; then
            SIGN_ID="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          fi
          if [ -z "${SIGN_ID}" ]; then
            echo "Error: no Developer ID Application signing identity found in keychain" >&2
            security find-identity -v -p codesigning || true
            exit 1
          fi
          echo "Using macOS signing identity: ${SIGN_ID}"
          echo "MAC_SIGNING_IDENTITY=${SIGN_ID}" >> "${GITHUB_ENV}"

      - name: Download canonical updater payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chat2db-community-canonical-payload-${{ needs.resolve.outputs.version }}
          path: jpackage/canonical-artifact

      - name: Build Community desktop installer
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
          CANONICAL_ARTIFACT_DIR: ${{ github.workspace }}/jpackage/canonical-artifact/${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          script/package/package-community-jcef.sh "${VERSION}" "${TARGET}"

      - name: Notarize macOS package
        if: ${{ runner.os == 'macOS' }}
        timeout-minutes: 30
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          MAC_APPLE_PASSWORD: ${{ secrets.MAC_APPLE_PASSWORD }}
          MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
        run: |
          set -euo pipefail

          for required in MAC_APPLE_ID MAC_APPLE_PASSWORD MAC_TEAM_ID; do
            if [ -z "${!required}" ]; then
              echo "Missing required notarization secret: ${required}" >&2
              exit 1
            fi
          done

          case "${ARTIFACT_NAME}" in
            macos-arm64) dmg="jpackage/output/Chat2DB-Community-${VERSION}-arm64.dmg" ;;
            macos-x64) dmg="jpackage/output/Chat2DB-Community-${VERSION}-x64.dmg" ;;
            *)
              echo "Unexpected macOS artifact name: ${ARTIFACT_NAME}" >&2
              exit 1
              ;;
          esac
          test -s "${dmg}"

          submit_result="${RUNNER_TEMP}/notary-submit-${ARTIFACT_NAME}.json"
          wait_result="${RUNNER_TEMP}/notary-wait-${ARTIFACT_NAME}.json"
          submit_exit=0
          xcrun notarytool submit "${dmg}" \
            --apple-id "${MAC_APPLE_ID}" \
            --password "${MAC_APPLE_PASSWORD}" \
            --team-id "${MAC_TEAM_ID}" \
            --no-wait \
            --output-format json > "${submit_result}" || submit_exit=$?
          cat "${submit_result}"

          submission_id=$(/usr/bin/plutil -extract id raw -expect string -o - "${submit_result}" 2>/dev/null || true)
          if [ "${submit_exit}" -ne 0 ] || [ -z "${submission_id}" ]; then
            echo "Apple notarization submission failed: submission=${submission_id:-unknown}" >&2
            if [ -n "${submission_id}" ]; then
              xcrun notarytool log "${submission_id}" \
                --apple-id "${MAC_APPLE_ID}" \
                --password "${MAC_APPLE_PASSWORD}" \
                --team-id "${MAC_TEAM_ID}" || true
            fi
            exit 1
          fi

          echo "Apple notarization submission: ${submission_id}"
          wait_exit=0
          xcrun notarytool wait "${submission_id}" \
            --apple-id "${MAC_APPLE_ID}" \
            --password "${MAC_APPLE_PASSWORD}" \
            --team-id "${MAC_TEAM_ID}" \
            --timeout 25m \
            --output-format json > "${wait_result}" || wait_exit=$?
          cat "${wait_result}"

          notary_status=$(/usr/bin/plutil -extract status raw -expect string -o - "${wait_result}" 2>/dev/null || true)
          if [ "${wait_exit}" -ne 0 ] || [ "${notary_status}" != "Accepted" ]; then
            echo "Apple notarization failed: status=${notary_status:-unknown}, submission=${submission_id:-unknown}" >&2
            if ! xcrun notarytool log "${submission_id}" \
              --apple-id "${MAC_APPLE_ID}" \
              --password "${MAC_APPLE_PASSWORD}" \
              --team-id "${MAC_TEAM_ID}"; then
              echo "Unable to retrieve Apple notarization log for ${submission_id}" >&2
            fi
            exit 1
          fi

          xcrun stapler staple "${dmg}"
          xcrun stapler validate "${dmg}"

      - name: Upload native installer outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat2db-community-${{ needs.resolve.outputs.version }}-${{ matrix.artifact_name }}
          if-no-files-found: error
          overwrite: true
          path: |
            jpackage/output/*.dmg
            jpackage/output/*.msi
            jpackage/output/*.deb
            jpackage/output/*.rpm
            jpackage/output/*.AppImage

  validate_release_bundle:
    name: Validate release bundle
    needs:
      - resolve
      - build_update_payloads
      - build_native_packages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download canonical updater payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chat2db-community-canonical-payload-${{ needs.resolve.outputs.version }}
          path: jpackage/canonical-artifact

      - name: Download native installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: chat2db-community-${{ needs.resolve.outputs.version }}-*
          path: downloaded-artifacts

      - name: Validate release bundle
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
          REPO: ${{ env.COMMUNITY_GITHUB_REPOSITORY }}
          CANONICAL_ARTIFACT_DIR: ${{ github.workspace }}/jpackage/canonical-artifact/${{ needs.resolve.outputs.version }}
          PLATFORM_ARTIFACTS_DIR: ${{ github.workspace }}/downloaded-artifacts
          IS_BRIDGE_N: ${{ needs.resolve.outputs.is_bridge_n }}
          BRIDGE_VERSION: ${{ env.COMMUNITY_BRIDGE_VERSION }}
          CDN_BASE_URL: https://cdn.chat2db-ai.com/community/updates
          ALLOWED_EXTRA_RELEASE_ASSETS: ${{ env.ALLOWED_EXTRA_RELEASE_ASSETS }}
        run: |
          set -euo pipefail
          script/release/validate_release_bundle.sh

      - name: Upload validated release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: community-release-bundle-${{ needs.resolve.outputs.version }}
          if-no-files-found: error
          overwrite: true
          path: release-assets/*

  stage_github_release:
    name: Stage draft GitHub Release
    needs:
      - resolve
      - validate_release_bundle
    if: ${{ needs.resolve.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install staging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download validated release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: community-release-bundle-${{ needs.resolve.outputs.version }}
          path: release-assets

      - name: Stage draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_ASSETS_DIR: ${{ github.workspace }}/release-assets
          ALLOWED_EXTRA_RELEASE_ASSETS: ${{ env.ALLOWED_EXTRA_RELEASE_ASSETS }}
        run: |
          set -euo pipefail
          script/release/stage_github_release.sh

  cdn_bridge_release:
    name: Publish bridge release to legacy CDN
    needs:
      - resolve
      - validate_release_bundle
    if: ${{ needs.resolve.outputs.is_bridge_n == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: chat2db-community-${{ needs.resolve.outputs.version }}-*
          path: downloaded-artifacts

      - name: Download canonical updater payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chat2db-community-canonical-payload-${{ needs.resolve.outputs.version }}
          path: jpackage/canonical-artifact

      - name: Validate CDN bridge bundle and generate manifest
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          PACKAGE_PREFIX: ${{ needs.resolve.outputs.package_prefix }}
          UPDATE_PREFIX: ${{ needs.resolve.outputs.update_prefix }}
          CDN_BASE_URL: https://cdn.chat2db-ai.com
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          expected=(
            "Chat2DB-Community-${VERSION}-arm64.dmg"
            "Chat2DB-Community-${VERSION}-x64.dmg"
            "Chat2DB-Community-${VERSION}.msi"
            "Chat2DB-Community-${VERSION}-amd64.deb"
            "Chat2DB-Community-${VERSION}-arm64.deb"
            "Chat2DB-Community-${VERSION}-x86_64.rpm"
            "Chat2DB-Community-${VERSION}-aarch64.rpm"
            "Chat2DB-Community-${VERSION}-x86_64.AppImage"
            "Chat2DB-Community-${VERSION}-arm64.AppImage"
          )

          mapfile -d '' installers < <(
            find downloaded-artifacts -type f \
              \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
              -print0
          )
          if [ "${#installers[@]}" -ne "${#expected[@]}" ]; then
            echo "Expected ${#expected[@]} installers, found ${#installers[@]}" >&2
            printf ' - %s\n' "${installers[@]}" >&2
            exit 1
          fi

          mkdir -p cdn-assets/release cdn-assets/updates
          for asset in "${expected[@]}"; do
            mapfile -t matches < <(find downloaded-artifacts -type f -name "${asset}")
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one ${asset}, found ${#matches[@]}" >&2
              exit 1
            fi
            test -s "${matches[0]}"
            cp "${matches[0]}" "cdn-assets/release/${asset}"
          done

          canonical_dir="jpackage/canonical-artifact/${VERSION}"
          for payload in chat2db-community.jar lib.zip dist.zip; do
            test -s "${canonical_dir}/${payload}"
            cp "${canonical_dir}/${payload}" "cdn-assets/updates/${payload}"
          done

          # Generate CDN-compatible version.json from the GitHub manifest by
          # rewriting payload URLs and removing GitHub-only top-level fields.
          # Legacy clients must receive only fields they already understand.
          github_manifest="${canonical_dir}/version.json"
          test -s "${github_manifest}"
          jq --arg base "${CDN_BASE_URL}/${UPDATE_PREFIX}" '
            del(.releasePageUrl, .forceUpdate) |
            .files |= map(.url = "\($base)/\(.serverFileName)")
          ' "${github_manifest}" > "cdn-assets/updates/version.json"

          (
            cd cdn-assets/release
            sha256sum "${expected[@]}" > SHA256SUMS
          )

          VERSION="${VERSION}" CHANNEL="${CHANNEL}" PACKAGE_PREFIX="${PACKAGE_PREFIX}" UPDATE_PREFIX="${UPDATE_PREFIX}" CDN_BASE_URL="${CDN_BASE_URL}" RUN_URL="${RUN_URL}" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release_dir = Path("cdn-assets/release")
          files = []
          for path in sorted(release_dir.iterdir()):
              if path.name == "SHA256SUMS":
                  continue
              files.append(
                  {
                      "name": path.name,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "url": f"{os.environ['CDN_BASE_URL']}/{os.environ['PACKAGE_PREFIX']}/{path.name}",
                  }
              )

          manifest = {
              "edition": "Chat2DB Community",
              "version": os.environ["VERSION"],
              "channel": os.environ["CHANNEL"],
              "run_url": os.environ["RUN_URL"],
              "files": files,
          }
          Path("cdn-assets/release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Set up ossutil
        uses: yizhoumo/setup-ossutil@02384914fef2758596b303e2035c47b8c3f80fb2
        with:
          endpoint: oss-us-west-1.aliyuncs.com
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          ossutil-version: '1.7.16'

      - name: Set up Aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5
        with:
          version: '3.4.8'

      - name: Upload bridge release packages to CDN
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          PACKAGE_PREFIX: ${{ needs.resolve.outputs.package_prefix }}
          UPDATE_PREFIX: ${{ needs.resolve.outputs.update_prefix }}
          OSS_BUCKET_NAME: chat2db-cdn
          CDN_BASE_URL: https://cdn.chat2db-ai.com
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_NOTIFY_WEBHOOK }}
        run: |
          set -euo pipefail

          send_package_notification() {
            local package_name="$1"
            local package_url="$2"
            PACKAGE_NAME="${package_name}" PACKAGE_URL="${package_url}" CHANNEL="${CHANNEL}" python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook = os.environ.get("FEISHU_WEBHOOK_URL", "")
          if not webhook:
              print("FEISHU_RELEASE_NOTIFY_WEBHOOK is not configured; skip package notification.")
              raise SystemExit(0)

          text = "\n".join(
              [
                  "Chat2DB Community bridge release package published to CDN",
                  f"Version: {os.environ['VERSION']}",
                  f"Channel: {os.environ['CHANNEL']}",
                  f"Package: {os.environ['PACKAGE_NAME']}",
                  f"Download URL: {os.environ['PACKAGE_URL']}",
              ]
          )
          payload = json.dumps(
              {"msg_type": "text", "content": {"text": text}}, ensure_ascii=False
          ).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if result.get("code", 0) != 0:
                  print(f"::warning::Feishu package notification was rejected: {result}")
          except urllib.error.URLError as exc:
              print(f"::warning::Feishu package notification failed: {exc}")
          PY
          }

          for file in cdn-assets/release/*; do
            name="$(basename "${file}")"
            destination="oss://${OSS_BUCKET_NAME}/${PACKAGE_PREFIX}/${name}"
            ossutil cp -f --meta "Cache-Control:no-cache" "${file}" "${destination}"
            ossutil stat "${destination}"
            if [ "${name}" != "SHA256SUMS" ]; then
              send_package_notification "${name}" "${CDN_BASE_URL}/${PACKAGE_PREFIX}/${name}"
            fi
          done

          for file in cdn-assets/updates/*; do
            name="$(basename "${file}")"
            destination="oss://${OSS_BUCKET_NAME}/${UPDATE_PREFIX}/${name}"
            ossutil cp -f --meta "Cache-Control:no-cache" "${file}" "${destination}"
            ossutil stat "${destination}"
          done

          VERSION="${VERSION}" UPDATE_PREFIX="${UPDATE_PREFIX}" CDN_BASE_URL="${CDN_BASE_URL}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "latestVersion": os.environ["VERSION"],
              "metadataUrl": f"{os.environ['CDN_BASE_URL']}/{os.environ['UPDATE_PREFIX']}/version.json",
              "forceUpdate": False,
          }
          Path("cdn-assets/latest_version.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          destination="oss://${OSS_BUCKET_NAME}/community/updates/latest_version.json"
          ossutil cp -f --meta "Cache-Control:no-cache" cdn-assets/latest_version.json "${destination}"
          ossutil stat "${destination}"

          manifest_destination="oss://${OSS_BUCKET_NAME}/${PACKAGE_PREFIX}/release-manifest.json"
          ossutil cp -f --meta "Cache-Control:no-cache" cdn-assets/release-manifest.json "${manifest_destination}"
          ossutil stat "${manifest_destination}"

      - name: Refresh Community CDN cache
        shell: bash
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_REGION_ID: cn-hangzhou
          PACKAGE_PREFIX: ${{ needs.resolve.outputs.package_prefix }}
          UPDATE_PREFIX: ${{ needs.resolve.outputs.update_prefix }}
          CDN_BASE_URL: https://cdn.chat2db-ai.com
        run: |
          set -euo pipefail

          refresh_task_ids=()

          submit_refresh() {
            local object_path="$1"
            local object_type="$2"
            local force="${3:-}"
            local -a command=(
              aliyun cdn RefreshObjectCaches
              --ObjectPath "${object_path}"
              --ObjectType "${object_type}"
            )
            if [ -n "${force}" ]; then
              command+=(--Force "${force}")
            fi

            local output task_id
            output="$("${command[@]}")"
            echo "${output}"
            task_id="$(jq -r '.RefreshTaskId // empty' <<<"${output}")"
            if [ -z "${task_id}" ]; then
              echo "CDN refresh response did not include RefreshTaskId for ${object_path}" >&2
              exit 1
            fi
            refresh_task_ids+=("${task_id}")
          }

          wait_for_refresh() {
            local task_id="$1"
            local deadline=$((SECONDS + 300))

            while [ "${SECONDS}" -lt "${deadline}" ]; do
              local output status
              output="$(aliyun cdn DescribeRefreshTasks --TaskId "${task_id}")"
              status="$(jq -r '
                (.Tasks.CDNTask // []) as $tasks
                | if ($tasks | length) == 0 then "Pending"
                  elif any($tasks[]; .Status == "Failed") then "Failed"
                  elif all($tasks[]; .Status == "Complete") then "Complete"
                  else "Refreshing"
                  end
              ' <<<"${output}")"

              if [ "${status}" = "Complete" ]; then
                echo "CDN refresh task ${task_id} completed"
                return 0
              fi
              if [ "${status}" = "Failed" ]; then
                echo "CDN refresh task ${task_id} failed: ${output}" >&2
                return 1
              fi
              sleep 5
            done

            echo "Timed out waiting for CDN refresh task ${task_id}" >&2
            return 1
          }

          submit_refresh \
            "${CDN_BASE_URL}/${PACKAGE_PREFIX}/" \
            Directory \
            true
          submit_refresh \
            "${CDN_BASE_URL}/${UPDATE_PREFIX}/" \
            Directory \
            true
          submit_refresh \
            "${CDN_BASE_URL}/community/updates/latest_version.json" \
            File

          mapfile -t refresh_task_ids < <(
            printf '%s\n' "${refresh_task_ids[@]}" | sort -u
          )
          for task_id in "${refresh_task_ids[@]}"; do
            wait_for_refresh "${task_id}"
          done

      - name: Upload CDN distribution receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: community-cdn-receipt-${{ needs.resolve.outputs.version }}
          if-no-files-found: error
          overwrite: true
          path: |
            cdn-assets/release/SHA256SUMS
            cdn-assets/release-manifest.json
            cdn-assets/latest_version.json

  docker:
    name: Publish Docker image
    needs:
      - resolve
      - stage_github_release
    if: ${{ needs.resolve.outputs.publish == 'true' }}
    uses: ./.github/workflows/pushdocker.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      push_latest: true
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish_github_release:
    name: Publish GitHub Release
    needs:
      - resolve
      - stage_github_release
      - docker
    if: ${{ needs.resolve.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish validated Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release edit "${TAG_NAME}" --draft=false --latest
          test "$(gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft')" = "false"

  verify_latest_release:
    name: Verify public latest release
    needs:
      - resolve
      - publish_github_release
    if: ${{ needs.resolve.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Download validated release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: community-release-bundle-${{ needs.resolve.outputs.version }}
          path: release-assets

      - name: Verify public latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REPO: ${{ env.COMMUNITY_GITHUB_REPOSITORY }}
          RELEASE_ASSETS_DIR: ${{ github.workspace }}/release-assets
          ALLOWED_EXTRA_RELEASE_ASSETS: ${{ env.ALLOWED_EXTRA_RELEASE_ASSETS }}
        run: |
          set -euo pipefail
          script/release/verify_latest_release.sh

  notify_summary:
    name: Notify Feishu Community gray build summary
    needs:
      - resolve
      - build_update_payloads
      - build_native_packages
      - cdn_bridge_release
    if: ${{ always() && needs.resolve.outputs.channel == 'gray' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Send Feishu summary notification
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_NOTIFY_WEBHOOK }}
          VERSION: ${{ needs.resolve.outputs.version || inputs.version }}
          BUILD_RESULT: ${{ needs.build_native_packages.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          webhook = os.environ.get("FEISHU_WEBHOOK_URL", "")
          if not webhook:
              print("FEISHU_RELEASE_NOTIFY_WEBHOOK is not configured; skip summary notification.")
              raise SystemExit(0)

          def failed_build_jobs():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs?per_page=100",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      jobs = json.loads(response.read().decode("utf-8")).get("jobs", [])
              except Exception as exc:
                  return [f"- Failed to read job details: {exc}"]

              failed = []
              for job in jobs:
                  name = job.get("name", "")
                  conclusion = job.get("conclusion") or job.get("status") or "unknown"
                  if name.startswith("Build ") and conclusion != "success":
                      failed.append(f"- {name}: {conclusion}")
              return failed or [
                  "- No failed build job details were returned; see the workflow run."
              ]

          version = os.environ["VERSION"]
          build_result = os.environ["BUILD_RESULT"]
          run_url = os.environ["RUN_URL"]

          if build_result == "success":
              lines = [
                  "Chat2DB Community gray build completed",
                  f"Version: {version}",
                  f"Build result: {build_result}",
                  "Distribution: GitHub Actions artifacts only",
                  f"Workflow run: {run_url}",
              ]
          else:
              lines = [
                  "Chat2DB Community gray build did not complete successfully",
                  f"Version: {version}",
                  f"Build result: {build_result}",
                  "Failed build jobs:",
                  *failed_build_jobs(),
                  f"Workflow run: {run_url}",
              ]

          payload = json.dumps(
              {"msg_type": "text", "content": {"text": "\n".join(lines)}},
              ensure_ascii=False,
          ).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if result.get("code", 0) != 0:
                  print(f"::warning::Feishu summary notification was rejected: {result}")
          except urllib.error.URLError as exc:
              print(f"::warning::Feishu summary notification failed: {exc}")
