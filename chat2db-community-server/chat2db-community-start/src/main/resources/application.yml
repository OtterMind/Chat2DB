spring:
  application:
    name: chat2db
  # Default development profile.
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
    lazy-initialization: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallbackToSystemLocale: true
  jmx:
    enabled: false
  # thymeleaf
  thymeleaf:
    prefix: classpath:/thymeleaf/
    check-template-location: true
    suffix: .html
    servlet:
      content-type: text/html
    mode: HTML5
  # Static files.
  mvc:
    static-path-pattern: /static/**
  web:
    resources:
      static-locations[0]: classpath:/static/
  flyway:
    enabled: false
  # Database schema version management.
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  jackson:
    serialization:
      write-dates-as-timestamps: true
  ai:
    mcp:
      server:
        request-timeout: 300s
        version: 1.0.0
        enabled: false
        stdio: false
        protocol: STREAMABLE
        sse-endpoint: /mcp
        name: chat2db
        instructions: >
          Chat2DB MCP tools can work with or without a selected datasource.
          If X-Chat2DB-DataSource-Id is configured, tools use it as the default scope.
          If no datasource header is configured, call list_all_datasources first, then pass dataSourceId and optionally databaseName/schemaName to database tools.


chat2db:
  version: 5.3.0
  agent:
    pi:
      version: ${CHAT2DB_PI_RUNTIME_VERSION:0.85.1}
      source: ${CHAT2DB_PI_RUNTIME_SOURCE:https://github.com/earendil-works/pi/releases/download/v0.85.1/}
      max-processes: ${CHAT2DB_PI_MAX_PROCESSES:3}
      archive-sha256:
        macos-arm64: ${CHAT2DB_PI_ARCHIVE_SHA256_MACOS_ARM64:d5f70e3c0cf7398eac239fd0261ee074d98b7ba7f6b43fe3617f052ed5b79d06}
        macos-x64: ${CHAT2DB_PI_ARCHIVE_SHA256_MACOS_X64:adb918b845625f184d8bea408d55eacaf21aa87238793c0f5b4f3b9737bce62b}
        windows-arm64: ${CHAT2DB_PI_ARCHIVE_SHA256_WINDOWS_ARM64:b25e96fe64c9f41f75a924c0d36f395abb98d6c6fec0b78aaa0b86926f938bb4}
        windows-x64: ${CHAT2DB_PI_ARCHIVE_SHA256_WINDOWS_X64:002fa95b90d521245b9985d8f168caebc237ad56e7e30b319807dee1b2e17e1c}
        linux-arm64: ${CHAT2DB_PI_ARCHIVE_SHA256_LINUX_ARM64:042d20ae885ee4f3b102815f3280b962c377b2e9fb44de4037908cc530eae4d4}
        linux-x64: ${CHAT2DB_PI_ARCHIVE_SHA256_LINUX_X64:494e498f47d74d21f40b3386f6a5e921a3d49531a169cab55bbdaca0ea1fe25a}

# Print the HTTP log
logbook:
  include:
    - /api/**
