import.preview.invalidColumnRange=Rango de columnas no válido. Use un rango como B:H; la columna final no debe preceder a la inicial.
import.preview.invalidJsonOptions=Opciones JSON no válidas. Compruebe la estructura y el nodo de datos.
import.value.invalidValue=No se puede convertir el valor "{2}" de la fila {0}, columna "{1}". Revise la configuración de fecha, hora y formato decimal.
import.preview.jsonEncodingMismatch=No se puede leer el JSON con la codificación {0}. Compruebe que la codificación indicada coincida con el archivo.
import.preview.jsonExpectedArray=El nodo JSON “{0}” no es una matriz de objetos. Compruebe la estructura e indique la ruta de la matriz, por ejemplo $.data.items.
import.preview.jsonExpectedObject=El nodo o registro JSON no es un objeto. Compruebe la estructura y el nodo “{0}”; cada registro de la matriz debe ser un objeto.
import.preview.jsonPathNotFound=No se encontró el nodo JSON “{0}”. Compruebe la ruta y los nombres de campo.
import.preview.jsonInvalidLines=Cada línea no vacía de JSON Lines debe contener un objeto completo. Compruebe los saltos de línea y la estructura.
import.preview.jsonInvalidSyntax=No se puede analizar el JSON en la línea {0}, columna {1}. Compruebe las comillas, comas, corchetes y la estructura.
import.preview.jsonInvalidLine=No se puede analizar JSON Lines en la línea {0}. Cada línea no vacía debe ser un objeto JSON completo.
import.preview.jsonInvalidDocument=El documento JSON está incompleto o contiene contenido adicional. Compruebe los corchetes y la estructura.
import.preview.parseFailed=No se puede analizar el archivo de importación. Compruebe el contenido y el formato indicado arriba.
import.preview.fileUnreadable=No se puede leer el archivo de importación. Selecciónelo de nuevo y reintente.
import.preview.emptyFile=El rango seleccionado no contiene datos para previsualizar. Compruebe la hoja, el encabezado, el rango o el nodo JSON.
import.preview.duplicateSourceColumns=El campo de origen “{0}” está duplicado. Cambie el nombre del campo duplicado.
import.preview.invalidRowRange=Rango de filas no válido: empieza en 1, los datos deben seguir al encabezado y la fila final no debe preceder a la inicial.
import.preview.invalidValueFormat=Formato de fecha o número no válido. Compruebe el orden de fecha, los delimitadores y el símbolo decimal.
import.preview.invalidExcelFile=No se puede leer el archivo Excel. Seleccione un XLS/XLSX válido y compruebe si está dañado o cifrado.
import.preview.excelSheetMissing=La hoja seleccionada no existe. Seleccione una hoja del archivo.
import.preview.excelCellError=La fila {0}, columna {1} de Excel contiene una celda de error. Corríjala en el archivo y reintente.
import.sql.encodingMismatch=No se puede leer el archivo SQL con la codificación {0}. Seleccione la codificación del archivo y reintente.
import.sql.parseFailed=No se puede analizar el archivo SQL. Compruebe el contenido y la codificación.
import.sql.executionFailed=La base de datos rechazó la sentencia de importación. Compruebe el SQL, la tabla destino y los permisos.
import.sql.constraintViolation=Los datos incumplen una restricción de la tabla destino. Compruebe claves duplicadas, campos obligatorios y claves foráneas.
import.sql.invalidValue=Un valor no coincide con el tipo de la columna destino. Compruebe rangos numéricos, longitudes y formatos de fecha y hora.
import.sql.invalidStatement=La sentencia de importación no es válida. Compruebe la sintaxis SQL y los nombres de tablas y columnas.
import.sql.connectionFailed=Falló la conexión a la base de datos durante la importación. Compruebe la conexión y el estado de la base de datos.
import.file.failed=No se pudo importar el archivo de datos. Compruebe el contenido, el formato y las columnas destino.
